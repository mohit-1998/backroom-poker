<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B100E">
<title>Backroom Poker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- shared gradient for the 3D chip rims -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="rimShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".5"/>
      <stop offset=".28" stop-color="#fff" stop-opacity=".16"/>
      <stop offset=".55" stop-color="#000" stop-opacity=".05"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </linearGradient>
  </defs>
</svg>

<!-- ============ LOBBY ============ -->
<section id="lobby">
  <div class="lobby-wrap">
    <div class="hero-copy">
      <div class="brand">Backroom</div>
      <h1>Poker night,<br>no table needed.</h1>
      <p>Open a room, share the code, and let up to eight players sit down. Empty seats are filled by bots.</p>
      <div class="floating-cards" aria-hidden="true">
        <div class="fc a"><b>A</b><i>♥</i></div>
        <div class="fc b"><b>A</b><i>♠</i></div>
      </div>
    </div>

    <div class="card">
      <div id="lobbyErr" class="err" role="alert" hidden></div>
      <div class="card-title">Create a room</div>

      <label for="name">Your name</label>
      <input id="name" type="text" maxlength="14" autocomplete="nickname" placeholder="Your name">

      <div class="row2">
        <div>
          <span class="lbl">Bots at the table</span>
          <div class="stepper">
            <button id="botsMinus" aria-label="Fewer bots">−</button>
            <output id="botsOut">3</output>
            <button id="botsPlus" aria-label="More bots">+</button>
          </div>
        </div>
        <div>
          <span class="lbl">Seats</span>
          <div class="static" id="seatsOut">1 + 3 bots · 8 max</div>
        </div>
      </div>

      <span class="lbl">Starting chips and blinds</span>
      <div class="presets" id="presets">
        <button data-chips="1000" data-bb="10">1,000<small>Blinds 5 / 10</small></button>
        <button data-chips="2000" data-bb="20" class="on">2,000<small>Blinds 10 / 20</small></button>
        <button data-chips="5000" data-bb="50">5,000<small>Blinds 25 / 50</small></button>
      </div>

      <button id="createBtn" class="primary">Create room &amp; sit down</button>

      <div class="or"><span>or join friends</span></div>

      <div class="joinrow">
        <label for="code" class="sr">Room code</label>
        <input id="code" type="text" maxlength="4" placeholder="Room code, e.g. KXQ7" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button id="joinBtn" class="ghost">Join</button>
      </div>
      <div id="conn" class="conn"></div>
    </div>
  </div>
</section>

<!-- ============ GAME ============ -->
<section id="game" hidden>
  <header class="top">
    <div class="top-left">
      <div class="brand small">Backroom</div>
      <button id="roomPill" class="pill" title="Copy invite link">
        <span>Room</span><strong id="roomCode">----</strong><span class="sep">·</span><span id="seated">1 / 8</span>
      </button>
      <div class="meta" id="blinds"></div>
    </div>
    <div class="top-right">
      <button id="inviteBtn" class="ghost sm">Invite friends</button>
      <button id="handsBtn" class="icon" aria-label="Hand rankings" title="Hand rankings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
      </button>
      <button id="soundBtn" class="icon" aria-label="Sound on" title="Sound">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="sndOn" d="M16.5 8.5a5 5 0 0 1 0 7"/><path id="sndOff" d="M17 9l5 6M22 9l-5 6" style="display:none"/></svg>
      </button>
      <button id="leaveBtn" class="icon" aria-label="Leave table" title="Leave table">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H5v16h4"/><path d="M16 8l4 4-4 4"/><path d="M20 12H9"/></svg>
      </button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main class="main">
    <div class="stages" id="stageTabs"></div>
    <div class="stage" id="stage">
      <div class="rail"></div>
      <div class="felt"></div>
      <div class="inner-line"></div>
      <div id="potBox" class="potbox"></div>
      <div id="board" class="board"></div>
      <div id="result" class="resultline"></div>
      <div id="bets"></div>
      <div id="seats"></div>
      <div id="wait" class="wait" hidden></div>
    </div>
  </main>

  <aside id="logPanel" class="panel log" aria-label="Table log">
    <div class="p-title">Table log</div>
    <div id="logLines"></div>
  </aside>

  <aside id="handsPanel" class="panel hands" hidden aria-label="Hand rankings">
    <div class="p-title">What beats what <button id="handsClose" class="x" aria-label="Close">×</button></div>
    <div id="handsList"></div>
    <div class="p-title" style="margin-top:14px">Clay chip values</div>
    <div id="legend" class="legend"></div>
  </aside>

  <footer class="actions" id="actions"></footer>
  <div id="toast" class="toast" hidden></div>
</section>

<script src="app.js"></script>
</body>
</html>
